<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#142018" />
    <title>Sem conexão | Independência Motos</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f8f3; color: #142018; font-family: system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 36px; border: 1px solid #e3e8de; border-radius: 24px; background: white; box-shadow: 0 16px 40px #14201812; }
      .badge { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #eaf0e8; color: #224d38; font-size: 12px; font-weight: 700; }
      h1 { margin: 22px 0 10px; font-size: 26px; }
      p { color: #59665c; line-height: 1.6; }
      button { margin-top: 16px; padding: 13px 20px; border: 0; border-radius: 999px; background: #c6f15b; color: #142018; font: inherit; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #224d38; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">INDEPENDÊNCIA MOTOS</span>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar o catálogo, o CRM e as informações atualizadas.</p>
      <button type="button" onclick="window.location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
